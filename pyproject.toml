[project]
name = "erp-asistan"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "pyyaml",
    "python-dotenv",
    "mlx-whisper>=0.4.3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_asistan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = ["llm: needs a running Ollama model (slow); run with -m llm"]

[project.scripts]
erp-asistan = "erp_asistan.web:main"
