[project]
name = "erp-asistan"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "gradio",
    "pyyaml",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_asistan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
erp-asistan = "erp_asistan.ui:main"
